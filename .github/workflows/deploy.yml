name: Graded DevOps CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master

jobs:
  devops-pipeline:
    runs-on: ubuntu-latest
    
    steps:
    - name: 1. Checkout Source Code
      id: checkout
      uses: actions/checkout@v4

    - name: 2. Install Dependencies
      id: dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip install -r requirements.txt pytest flake8 mongomock

    - name: 3. Run Automated Test Suite
      id: test
      env:
        MONGO_URI: mongodb://localhost:27017/test_db
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        python3 -m pytest -v test_app.py

    - name: 4. Configure AWS Credentials
      id: aws-auth
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: 5. Log in to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: 6. Build Docker Image (Commit SHA Tagged)
      id: build
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: srinivas/ecr-repo
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

    - name: 7. Push Image to ECR
      id: push
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: srinivas/ecr-repo
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

    - name: 8. Deploy to EC2 via Safe SSH & Perform Health Check Verification Gate
      id: deploy
      env:
        EC2_HOST: 3.92.51.26
        RAW_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      run: |
        mkdir -p ~/.ssh
        # Use Python to safely write the text key file, removing any Windows carriage returns (\r) dynamically
        python3 -c "import os; data = os.environ['RAW_SSH_KEY'].replace('\r', ''); open(os.path.expanduser('~/.ssh/id_rsa'), 'w').write(data.strip() + '\n')"
        chmod 600 ~/.ssh/id_rsa
        
        # Inject the server host identity into known hosts to bypass user prompts
        ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
        
        # Open the SSH tunnel bypassing modern Post-Quantum algorithmic check blocks
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o KexAlgorithms=+curve25519-sha256 -o PubkeyAcceptedKeyTypes=+ssh-rsa ec2-user@$EC2_HOST << 'EEF'
          # Authenticate against AWS ECR
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ://amazonaws.com
          
          # Clean teardown of existing running container
          docker stop flask_app_prod || true
          docker rm flask_app_prod || true
          
          # Pull trace-tagged image
          docker pull ://amazonaws.com/srinivas/ecr-repo:${{ github.sha }}
          
          # Launch production service mapping port 5000
          docker run -d -p 5000:5000 --name flask_app_prod ://amazonaws.com/srinivas/ecr-repo:${{ github.sha }}
          
          # Deploy-Verification Health Check Gate
          sleep 5
          echo "Executing application deployment verification check..."
          if curl -f http://localhost:5000/; then
            echo "Deployment verification check passed successfully!"
          else
            echo "CRITICAL: Health verification failed!"
            exit 1
          fi
        EEF

    - name: 9. Send Success Notification Email
      if: success()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ://gmail.com
        server_port: 465
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_PASSWORD }}
        subject: "SUCCESS: CI/CD Pipeline Deployed Successfully"
        to: ${{ secrets.NOTIFICATION_EMAIL }}
        from: GitHub Pipeline Monitor <noreply@github.com>
        body: |
          Pipeline Run Status: SUCCESS
          ------------------------------------------
          The automated delivery pipeline has completed successfully.
          • Deployed Branch: ${{ github.ref_name }}
          • Traceable Commit SHA: ${{ github.sha }}
          • Target Compute Target: AWS EC2 Instance (3.92.51.26)
          
          Review Full Workflow Logs: https://github.com{{ github.run_id }}

    - name: 10. Send Failure Notification Email
      if: failure()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ://gmail.com
        server_port: 465
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_PASSWORD }}
        subject: "FAILURE: CI/CD Pipeline Execution Blocked"
        to: ${{ secrets.NOTIFICATION_EMAIL }}
        from: GitHub Pipeline Monitor <noreply@github.com>
        body: |
          Pipeline Run Status: FAILED
          ------------------------------------------
          The automated pipeline run has failed and stopped early.
          • Target Repository: ${{ github.repository }}
          • Broken Commit SHA: ${{ github.sha }}
          • Current Branch: ${{ github.ref_name }}
          
          Review logs breakdown immediately: https://github.com{{ github.run_id }}
