cat << 'EOF' > test_app.py
import pytest
from app import app

@pytest.fixture
def client():
    app.config['TESTING'] = True
    with app.test_client() as client:
        yield client

def test_home_route(client):
    """Test that the application home route evaluates without crashing."""
    response = client.get('/')
    assert response is not None

def test_health_endpoint(client):
    """Ensure basic application interface routing evaluates properly."""
    response = client.get('/')
    assert response.status_code in [200, 302, 404]
EOF
